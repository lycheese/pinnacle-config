# Settings for this Pinnacle config.
#
# Do not edit this file for personal changes: create `local.toml` next to it (gitignored) and set
# only the keys you want to change, using the same sections. Example:
#
#   [notes]
#   dir = "~/Documents/notes"
#
#   [local_ai]
#   model = "qwen3.5:4b"
#
# The config reads both on every reload (Mod+Ctrl+R). Scripts read them via
# `eval "$(pctl settings --env)"`, which exports every key as PCFG_<SECTION>_<KEY>.
# `~` at the start of a path means your home folder.

[apps]
# Commands run with `sh -c`, so they may contain arguments.
terminal = "alacritty"
# How scripts start a program in a new terminal window: %c is the app ID (used by window
# rules), %t the window title, and the program follows. foot: "foot --app-id %c --title %t".
terminal_run = "alacritty --class %c --title %t -e"
launcher = "fuzzel"
# Editor for Menu → f (files) and notes. Runs inside the terminal.
editor = "hx"
# Empty means the desktop default (xdg-open).
browser = ""
file_manager = ""

[display]
# Run every monitor at its highest refresh rate at native resolution.
# Many monitors report 60 Hz as preferred even when they can do 144 Hz or more.
max_refresh_rate = true

[waybar]
# Folder that contains the CPU sensor's hwmonN folder (waybar's `hwmon-path-abs`), read via
# temp1_input, e.g. "/sys/devices/platform/coretemp.0/hwmon" (Intel) or
# "/sys/devices/pci0000:00/0000:00:18.3/hwmon" (AMD k10temp).
# Empty: Intel coretemp if present, else the first thermal zone.
temperature_hwmon = ""

[files]
# Folders searched by Menu → f f (find file). Hidden and .gitignored files are skipped.
search_roots = ["~"]

[notes]
dir = "~/notes"

[capture]
# Daily notification with the number of unprocessed captures. Empty disables it.
remind_at = "09:00"
# Once a day, show a random capture older than `resurface_min_age_days`, at a random time
# between these two times.
resurface = true
resurface_from = "10:00"
resurface_until = "18:00"
resurface_min_age_days = 7

[agent]
# Working folder for research threads, slides and handed-off files.
dir = "~/agent"
# "claude" (Claude Code with your account) or "local" (Claude Code against Ollama).
# Menu → a b switches at runtime; Shift+entry runs once on the other backend.
backend = "claude"
# Folders searched for git repos by Menu → a f (new feature).
repo_roots = ["~/dev_local", "~/src"]
# Claude Code command. Profiles (Menu → a p / a n) are folders here, each a separate
# CLAUDE_CONFIG_DIR with its own login; the "default" profile is ~/.claude.
command = "claude"
profiles_dir = "~/.config/claude-profiles"

[local_ai]
# Ollama server and model used by the local backend and by inbox triage.
# Qwen3.5 9B (4-bit, ~6 GB) fits an 8 GB GPU; use a smaller model on less VRAM.
url = "http://localhost:11434"
model = "qwen3.5:9b"
# Context window for the agent, in tokens. Claude Code needs at least ~32k; more uses more VRAM.
context = 32768
