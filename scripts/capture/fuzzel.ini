# fuzzel config for the capture prompt (scripts/capture/quick.sh). It replaces your own
# fuzzel.ini for this prompt only; fuzzel 1.9 has no include, so copy colours here if you want them.
#
# Ctrl+Y and Ctrl+E are taken from their defaults (execute, cursor-end) for the capture keys;
# Enter still saves and End still moves to the end.

[key-bindings]
execute=Return KP_Enter
cursor-end=End
custom-1=Control+w
custom-2=Control+y
custom-3=Control+e
