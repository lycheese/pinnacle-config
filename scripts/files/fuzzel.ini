# fuzzel config for the find-file browser (scripts/files/browse.sh). It replaces your own
# fuzzel.ini for that list only; fuzzel 1.9 has no include, so copy colours here if you want them.
#
# Alt+Backspace goes up a folder (as in Doom Emacs), so deleting a word is Ctrl+Backspace only.

[key-bindings]
delete-prev-word=Control+BackSpace
# Alt+Backspace: parent folder
custom-1=Mod1+BackSpace
# Ctrl+H: show / hide hidden files
custom-2=Control+h
# Ctrl+F: fuzzy-find below this folder
custom-3=Control+f
# Ctrl+O: open this folder in the editor
custom-4=Control+o
# Ctrl+T: terminal in this folder
custom-5=Control+t
