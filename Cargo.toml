[workspace]
resolver = "3"
members = ["config", "pctl"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
# Keep this tag identical to the compositor version you built (see scripts/install-fedora.sh).
# Pinnacle's API is not stable yet; bump both together and read the migration notes:
# https://github.com/pinnacle-comp/pinnacle/blob/main/wiki/configuration/breaking-changes-and-migrations.md
pinnacle-api = { git = "https://github.com/pinnacle-comp/pinnacle", tag = "v0.2.4", default-features = false }
